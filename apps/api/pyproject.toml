[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-course-ai-assistant-api"
version = "0.1.0"
description = "计算机网络课程 AI 助教独立 API 骨架"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.9",
  "pydantic==2.13.4",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9,<3",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
