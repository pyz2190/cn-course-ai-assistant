name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Run evaluation checks
        run: |
          python scripts/run_evaluation_pipeline.py validate
          python scripts/run_evaluation_pipeline.py sync --dry-run
          python scripts/run_evaluation_pipeline.py evaluate --dry-run
          pytest apps/api
          ruff check apps/api scripts

      - name: Run remaining checks
        run: |
          npm run audit
          npm run check:contracts
          npm run lint:web
          npm run typecheck:web
          npm run test:web
          npm run build:web
